[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ktrader-simulator"
version = "0.1.0"
description = "Isolated Dear PyGui options trading simulator for KTrader."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dearpygui==2.3.1",
    "logzero>=1.7,<2",
    "python-dotenv>=1.0,<2",
    "pyotp>=2.9,<3",
    "smartapi-python>=1.5,<2",
    "tzdata>=2025.2",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
ktrader-simulator = "ktrader_simulator.main:main"
ktrader-market-check = "ktrader_simulator.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider --basetemp=.test-tmp"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dearpygui", "dearpygui.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
